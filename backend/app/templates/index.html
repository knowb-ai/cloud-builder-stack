<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cloud Builder Stack</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f6f7f9;
        color: #16181d;
      }

      main {
        width: min(720px, calc(100vw - 32px));
      }

      code {
        background: #e9ecf1;
        border-radius: 4px;
        padding: 2px 5px;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #111318;
          color: #f4f5f7;
        }

        code {
          background: #252a33;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Cloud Builder Stack backend is running.</h1>
      <p>
        Build the frontend with <code>cd frontend && npm run build</code>, then
        FastAPI will serve <code>{{ frontend_dist }}</code>.
      </p>
      <p>Health check: <a href="/api/health">/api/health</a></p>
    </main>
  </body>
</html>
